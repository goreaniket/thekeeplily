<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fffaf5"><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/account.css"><title>Sign in | TheKeeplily Co.</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/account.js" defer></script></head>
<body class="account-page"><main class="account-wrap"><a class="account-brand" href="index.html">✿ TheKeeplily Co.</a><section class="account-card"><p class="eyebrow">YOUR LITTLE CORNER</p><h1 id="form-title">Welcome back ♡</h1><p class="account-intro">Sign in or create an account to keep your orders and details together.</p><div class="auth-tabs"><button type="button" class="active" id="signin-tab">Sign in</button><button type="button" id="signup-tab">Create account</button></div><form id="auth-form"><label id="name-label" hidden>Full name<input id="full-name" autocomplete="name"></label><label>Email address<input id="email" type="email" autocomplete="email" required></label><label>Password<input id="password" type="password" minlength="8" autocomplete="current-password" required></label><button class="button primary account-submit" id="submit-button">Sign in</button></form><p id="auth-message" class="account-message" role="status"></p><a class="account-back" href="index.html">← Back to the shop</a></section></main></body></html>
